name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name PDF-Page-Capture pdf_page_capture_gui.py

      # Manual runs: download the exe from the run's Artifacts section
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Page-Capture-windows
          path: dist/PDF-Page-Capture.exe

      # Tag pushes: attach the exe to a GitHub Release for that tag
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/PDF-Page-Capture.exe
          generate_release_notes: true
